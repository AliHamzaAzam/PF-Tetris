name: release

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux }
          - { os: windows-latest, name: windows }
          - { os: macos-latest,   name: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxrandr-dev libxcursor-dev libxi-dev libudev-dev \
            libgl1-mesa-dev libfreetype-dev xvfb

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Smoke test
        if: matrix.name == 'linux'
        run: timeout 8 xvfb-run -a ./build/PF_Tetris || true

      - name: Package (Linux)
        if: matrix.name == 'linux'
        shell: bash
        run: |
          name=PF_Tetris
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; else tag="dev"; fi
          bin=$(find build -name "$name" -type f -perm -u+x | head -1)
          pkg="$name-$tag-linux"
          mkdir -p "staging/$pkg"
          cp "$bin" "staging/$pkg/"
          cp -R GameResources "staging/$pkg/"
          ( cd staging && zip -r "../$pkg.zip" "$pkg" >/dev/null )
          echo "ASSET=$pkg.zip" >> "$GITHUB_ENV"

      - name: Package (macOS)
        if: matrix.name == 'macos'
        shell: bash
        run: |
          name=PF_Tetris
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; else tag="dev"; fi
          bin=$(find build -name "$name" -type f -perm -u+x | head -1)
          pkg="$name-$tag-macos"
          mkdir -p "staging/$pkg/Frameworks"
          cp "$bin" "staging/$pkg/"
          cp -R GameResources "staging/$pkg/"
          # SFML links freetype as a dynamic framework on macOS; bundle it beside the
          # executable and rewrite the load path so the app runs on any Mac.
          fw=$(find build/_deps -type d -name 'freetype.framework' | head -1)
          cp -R "$fw" "staging/$pkg/Frameworks/"
          ref=$(otool -L "staging/$pkg/$name" | awk '/freetype\.framework/{print $1; exit}')
          install_name_tool -change "$ref" \
            "@executable_path/Frameworks/freetype.framework/Versions/A/freetype" \
            "staging/$pkg/$name"
          # install_name_tool invalidates the code signature; re-sign ad-hoc (arm64 requires it).
          codesign --force --sign - "staging/$pkg/$name"
          ( cd staging && zip -ry "../$pkg.zip" "$pkg" >/dev/null )
          echo "ASSET=$pkg.zip" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $name = "PF_Tetris"
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME } else { "dev" }
          $bin = Get-ChildItem build -Recurse -Filter "$name.exe" | Select-Object -First 1
          $pkg = "$name-$tag-windows"
          New-Item -ItemType Directory -Force -Path "staging/$pkg" | Out-Null
          Copy-Item $bin.FullName -Destination "staging/$pkg/"
          Copy-Item GameResources -Destination "staging/$pkg/" -Recurse
          Compress-Archive -Path "staging/$pkg" -DestinationPath "$pkg.zip" -Force
          "ASSET=$pkg.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify self-contained (Unix)
        if: matrix.name != 'windows'
        shell: bash
        run: |
          name=PF_Tetris
          bin=$(find staging -name "$name" -type f | head -1)
          echo "Checking $bin"
          if [ "${{ matrix.name }}" = "macos" ]; then
            bad=$(otool -L "$bin" | tail -n +2 | awk '{print $1}' \
                  | grep -vE '^/System/|^/usr/lib/|^@executable_path/|^@loader_path/' || true)
          else
            bad=$(ldd "$bin" 2>/dev/null | grep -iE 'not found|/home/runner|_deps' || true)
          fi
          if [ -n "$bad" ]; then
            echo "::error::$bin has non-system/unbundled dependencies:"; echo "$bad"; exit 1
          fi
          echo "OK: self-contained"

      - name: Upload build artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
